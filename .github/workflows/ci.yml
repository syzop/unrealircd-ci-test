name: CI

on:
  push:
    branches: [ "unreal60_dev" ]
  pull_request:
    branches: [ "unreal60_dev" ]

env:
  NOSERVICES: 1

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: installdependencies
      run: sudo apt-get install build-essential pkg-config gdb libssl-dev libpcre2-dev libargon2-dev libsodium-dev libc-ares-dev libcurl4-openssl-dev libjansson-dev
    - uses: actions/checkout@v4
    - name: build
      run: extras/build-tests/nix/build
    - name: run-tests
      run: extras/build-tests/nix/run-tests
